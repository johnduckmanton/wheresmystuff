    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalyticsFunction}
      RetentionInDays: 14
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId

  BucketName:
    Description: S3 Bucket Name for Photos
    Value: !Ref PhotoBucket
    Export:
      Name: !Sub ${AWS::StackName}-BucketName

  QRReportBucketName:
    Description: S3 Bucket Name for QR Codes and Reports
    Value: !Ref QRCodeReportBucket
    Export:
      Name: !Sub ${AWS::StackName}-QRReportBucketName

  AlertTopicArn:
    Description: SNS Topic ARN for Alerts
    Value: !Ref AlertTopic
    Export:
      Name: !Sub ${AWS::StackName}-AlertTopicArn

  DashboardUrl:
    Description: CloudWatch Dashboard URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${MonitoringDashboard}
    Export:
      Name: !Sub ${AWS::StackName}-DashboardUrl

  WebsiteBucket:
    Description: S3 Bucket Name for Frontend Website
    Value: !Ref WebsiteBucket
    Export:
      Name: !Sub ${AWS::StackName}-WebsiteBucket

  TableName:
    Description: DynamoDB Table Name
    Value: !Ref InventoryTable
    Export:
      Name: !Sub ${AWS::StackName}-TableName

  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
    Export:
      Name: !Sub ${AWS::StackName}-Region

