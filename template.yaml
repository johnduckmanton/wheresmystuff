            Path: /audit-logs/container/{containerId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Performance Metrics Lambda
  PerformanceMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/performanceMetrics.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricStatistics
                - cloudwatch:ListMetrics
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
                - logs:GetLogEvents
              Resource: '*'
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref AuditLogHMACSecret
      Events:
        GetPerformanceMetrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /performance/metrics
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Storage Alerts Lambda
  StorageAlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/storageAlerts.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref AuditLogHMACSecret
      Events:
        CheckStorageAlerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /storage-alerts/check
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        CreateStorageAlert:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /storage-alerts/create
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        ListStorageAlerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /storage-alerts
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        MarkAlertAsRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /storage-alerts/{id}/read
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        ResolveAlert:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /storage-alerts/{id}/resolve
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  # CloudWatch Resources for Monitoring and Alerting

  # SNS Topic for Alerts
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub home-inventory-alerts-${Environment}
      DisplayName: Home Inventory System Alerts
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Enhanced CloudWatch Dashboard for Production Monitoring
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub home-inventory-${Environment}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${ContainerFunction}" ],
                  [ ".", ".", ".", "${PackingFunction}" ],
                  [ ".", ".", ".", "${QRCodeFunction}" ],
                  [ ".", ".", ".", "${ProjectFunction}" ],
                  [ ".", ".", ".", "${UserManagementFunction}" ],
                  [ ".", ".", ".", "${InventoryFunction}" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Function Duration",
                "period": 300,
                "yAxis": {
                  "left": {
                    "min": 0,
                    "max": 30000
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${ContainerFunction}" ],
                  [ ".", ".", ".", "${PackingFunction}" ],
                  [ ".", ".", ".", "${QRCodeFunction}" ],
                  [ ".", ".", ".", "${ProjectFunction}" ],
                  [ ".", ".", ".", "${UserManagementFunction}" ],
                  [ ".", ".", ".", "${InventoryFunction}" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Function Errors",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${InventoryTable}" ],
                  [ ".", "ConsumedWriteCapacityUnits", ".", "." ],
                  [ ".", "ThrottledRequests", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "DynamoDB Capacity Usage & Throttling",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiName", "${HttpApi}" ],
                  [ ".", "4XXError", ".", "." ],
                  [ ".", "5XXError", ".", "." ],
                  [ ".", "Latency", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "API Gateway Requests, Errors & Latency",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${ContainerFunction}" ],
                  [ ".", ".", ".", "${PackingFunction}" ],
                  [ ".", ".", ".", "${QRCodeFunction}" ],
                  [ ".", ".", ".", "${ProjectFunction}" ],
                  [ ".", ".", ".", "${UserManagementFunction}" ],
                  [ ".", ".", ".", "${InventoryFunction}" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Invocations (Free Tier: 1M/month)",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/S3", "BucketSizeBytes", "BucketName", "${PhotoBucket}", "StorageType", "StandardStorage" ],
                  [ ".", ".", ".", "${QRCodeReportBucket}", ".", "." ],
                  [ ".", ".", ".", "${WebsiteBucket}", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "S3 Storage Usage (Free Tier: 5GB)",
                "period": 86400
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/S3", "NumberOfObjects", "BucketName", "${PhotoBucket}", "StorageType", "AllStorageTypes" ],
                  [ ".", ".", ".", "${QRCodeReportBucket}", ".", "." ],
                  [ ".", ".", ".", "${WebsiteBucket}", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "S3 Object Count",
                "period": 86400
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Logs", "IncomingBytes", "LogGroupName", "/aws/lambda/${ContainerFunction}" ],
                  [ ".", ".", ".", "/aws/lambda/${PackingFunction}" ],
                  [ ".", ".", ".", "/aws/lambda/${QRCodeFunction}" ],
                  [ ".", ".", ".", "/aws/lambda/${ProjectFunction}" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "CloudWatch Logs Ingestion (Free Tier: 5GB/month)",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Billing", "EstimatedCharges", "Currency", "USD", "ServiceName", "AmazonDynamoDB" ],
                  [ ".", ".", ".", ".", ".", "AWSLambda" ],
                  [ ".", ".", ".", ".", ".", "AmazonS3" ],
                  [ ".", ".", ".", ".", ".", "AmazonApiGateway" ],
                  [ ".", ".", ".", ".", ".", "AmazonCloudWatch" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Estimated Charges by Service",
                "period": 86400
              }
            }
          ]
        }

  # CloudWatch Alarms

  # High Error Rate Alarm
  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-high-error-rate-${Environment}
      AlarmDescription: High error rate detected in Lambda functions
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # High Duration Alarm
  HighDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-high-duration-${Environment}
      AlarmDescription: High duration detected in Lambda functions
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 25000  # 25 seconds
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # DynamoDB Throttling Alarm
  DynamoDBThrottlingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-dynamodb-throttling-${Environment}
      AlarmDescription: DynamoDB throttling detected
      MetricName: ThrottledRequests
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref InventoryTable
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # API Gateway 5XX Error Alarm
  APIGateway5XXAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-api-5xx-errors-${Environment}
      AlarmDescription: High 5XX error rate in API Gateway
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref HttpApi
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Free Tier Usage Monitoring Alarms

  # Lambda Invocations Free Tier Alarm (1M requests/month)
  LambdaFreeTierAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-lambda-free-tier-${Environment}
      AlarmDescription: Lambda invocations approaching free tier limit (1M/month)
      MetricName: Invocations
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 86400  # Daily
      EvaluationPeriods: 1
      Threshold: 800000  # 80% of 1M monthly limit
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # API Gateway Free Tier Alarm (1M requests/month)
  APIGatewayFreeTierAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-api-free-tier-${Environment}
      AlarmDescription: API Gateway requests approaching free tier limit (1M/month)
      MetricName: Count
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 86400  # Daily
      EvaluationPeriods: 1
      Threshold: 800000  # 80% of 1M monthly limit
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref HttpApi
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # CloudWatch Logs Free Tier Alarm (5GB ingestion/month)
  CloudWatchLogsFreeTierAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-logs-free-tier-${Environment}
      AlarmDescription: CloudWatch Logs ingestion approaching free tier limit (5GB/month)
      MetricName: IncomingBytes
      Namespace: AWS/Logs
      Statistic: Sum
      Period: 86400  # Daily
      EvaluationPeriods: 1
      Threshold: 4294967296  # 80% of 5GB (4GB in bytes)
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Cost Tracking Alarms

  # Daily Cost Alarm
  DailyCostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-daily-cost-${Environment}
      AlarmDescription: Daily costs exceeding expected threshold
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 86400  # Daily
      EvaluationPeriods: 1
      Threshold: !If [IsProduction, 2.0, 1.5]  # $2/day prod, $1.5/day dev
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Currency
          Value: USD
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # DynamoDB Cost Alarm
  DynamoDBCostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-dynamodb-cost-${Environment}
      AlarmDescription: DynamoDB costs exceeding expected threshold
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 86400  # Daily
      EvaluationPeriods: 1
      Threshold: !If [IsProduction, 10.0, 5.0]  # $10 prod, $5 dev
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Currency
          Value: USD
        - Name: ServiceName
          Value: AmazonDynamoDB
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # S3 Cost Alarm
  S3CostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-s3-cost-${Environment}
      AlarmDescription: S3 costs exceeding expected threshold
      MetricName: EstimatedCharges
      Namespace: AWS/Billing
      Statistic: Maximum
      Period: 86400  # Daily
      EvaluationPeriods: 1
      Threshold: !If [IsProduction, 5.0, 2.0]  # $5 prod, $2 dev
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: Currency
          Value: USD
        - Name: ServiceName
          Value: AmazonS3
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Security Monitoring Components

  # WAF Web ACL for API Gateway Protection
  WebACL:
    Type: AWS::WAFv2::WebACL
    Condition: IsProduction  # Only enable WAF in production for cost savings
    Properties:
      Name: !Sub home-inventory-waf-${Environment}
      Description: WAF protection for Home Inventory API Gateway
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      Rules:
        # AWS Managed Rule - Core Rule Set
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSetMetric
        # AWS Managed Rule - Known Bad Inputs
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputsMetric
        # Rate limiting rule
        - Name: RateLimitRule
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000  # 2000 requests per 5 minutes per IP
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitMetric
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub home-inventory-waf-${Environment}
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # WAF Association with API Gateway (Production only)
  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: IsProduction
    Properties:
      ResourceArn: !Sub arn:aws:apigateway:${AWS::Region}::/restapis/${HttpApi}/stages/${Environment}
      WebACLArn: !GetAtt WebACL.Arn

  # CloudWatch Log Group for WAF
  WAFLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsProduction
    Properties:
      LogGroupName: !Sub /aws/wafv2/home-inventory-${Environment}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # WAF Logging Configuration
  WAFLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    Condition: IsProduction
    Properties:
      ResourceArn: !GetAtt WebACL.Arn
      LogDestinationConfigs:
        - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/wafv2/home-inventory-${Environment}
      RedactedFields:
        - SingleHeader:
            Name: authorization
        - SingleHeader:
            Name: cookie

  # Security Monitoring Alarms

  # WAF Blocked Requests Alarm
  WAFBlockedRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub home-inventory-waf-blocked-requests-${Environment}
      AlarmDescription: High number of blocked requests detected by WAF
      MetricName: BlockedRequests
      Namespace: AWS/WAFV2
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 100  # More than 100 blocked requests in 10 minutes
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: WebACL
          Value: !Sub home-inventory-waf-${Environment}
        - Name: Region
          Value: !Ref AWS::Region
        - Name: Rule
          Value: ALL
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Authentication Failure Alarm (based on 4XX errors)
  AuthenticationFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-auth-failures-${Environment}
      AlarmDescription: High number of authentication failures (4XX errors)
      MetricName: 4XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 50  # More than 50 auth failures in 10 minutes
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref HttpApi
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Unusual Lambda Error Pattern Alarm
  UnusualErrorPatternAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-unusual-errors-${Environment}
      AlarmDescription: Unusual error pattern detected across Lambda functions
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 900  # 15 minutes
      EvaluationPeriods: 1
      Threshold: 25  # More than 25 errors in 15 minutes across all functions
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # DynamoDB Security Alarm (Unusual Read/Write Patterns)
  DynamoDBSecurityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-dynamodb-security-${Environment}
      AlarmDescription: Unusual DynamoDB access pattern detected
      MetricName: ConsumedReadCapacityUnits
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1000  # More than 1000 read units in 10 minutes
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref InventoryTable
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Additional Security Monitoring Alarms

  # Suspicious Login Pattern Alarm
  SuspiciousLoginAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-suspicious-logins-${Environment}
      AlarmDescription: Suspicious login pattern detected (multiple failed attempts)
      MetricName: 4XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300  # 5 minutes
      EvaluationPeriods: 3
      Threshold: 20  # More than 20 failed auth attempts in 15 minutes
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref HttpApi
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: AlertType
          Value: SecurityThreat

  # Data Exfiltration Detection Alarm
  DataExfiltrationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-data-exfiltration-${Environment}
      AlarmDescription: Potential data exfiltration detected (high S3 download volume)
      MetricName: NumberOfObjects
      Namespace: AWS/S3
      Statistic: Sum
      Period: 3600  # 1 hour
      EvaluationPeriods: 1
      Threshold: 1000  # More than 1000 objects accessed in 1 hour
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: BucketName
          Value: !Ref PhotoBucket
        - Name: StorageType
          Value: AllStorageTypes
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: AlertType
          Value: DataSecurity

  # Privilege Escalation Detection Alarm
  PrivilegeEscalationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-privilege-escalation-${Environment}
      AlarmDescription: Potential privilege escalation detected (unusual admin operations)
      MetricName: Invocations
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 900  # 15 minutes
      EvaluationPeriods: 1
      Threshold: 50  # More than 50 admin operations in 15 minutes
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref UserManagementFunction
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: AlertType
          Value: PrivilegeEscalation

  # Database Injection Attack Detection
  DatabaseInjectionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-db-injection-${Environment}
      AlarmDescription: Potential database injection attack detected
      MetricName: Errors
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300  # 5 minutes
      EvaluationPeriods: 2
      Threshold: 10  # More than 10 database errors in 10 minutes
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref InventoryTable
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: AlertType
          Value: InjectionAttack

  # Unusual API Usage Pattern Alarm
  UnusualAPIUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub home-inventory-unusual-api-usage-${Environment}
      AlarmDescription: Unusual API usage pattern detected (traffic spike)
      MetricName: Count
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300  # 5 minutes
      EvaluationPeriods: 2
      Threshold: 500  # More than 500 requests in 10 minutes
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref HttpApi
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: AlertType
          Value: TrafficAnomaly

  # CloudTrail for Audit Logging (Production only for cost savings)
  AuditTrail:
    Type: AWS::CloudTrail::Trail
    Condition: IsProduction
    Properties:
      TrailName: !Sub home-inventory-audit-trail-${Environment}
      S3BucketName: !Ref AuditTrailBucket
      S3KeyPrefix: cloudtrail-logs/
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: false  # Single region to minimize costs
      EnableLogFileValidation: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
          DataResources:
            - Type: AWS::DynamoDB::Table
              Values: 
                - !Sub "${InventoryTable}/*"
            - Type: AWS::S3::Object
              Values:
                - !Sub "${PhotoBucket}/*"
                - !Sub "${QRCodeReportBucket}/*"
            - Type: AWS::S3::Bucket
              Values:
                - !Ref PhotoBucket
                - !Ref QRCodeReportBucket
      CloudWatchLogsLogGroupArn: !Sub "${AuditTrailLogGroup}:*"
      CloudWatchLogsRoleArn: !GetAtt CloudTrailLogsRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: AuditLogging

  # S3 Bucket for CloudTrail Logs (Production only)
  AuditTrailBucket:
    Type: AWS::S3::Bucket
    Condition: IsProduction
    Properties:
      BucketName: !Sub home-inv-audit-trail-${AWS::AccountId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldAuditLogs
            Status: Enabled
            ExpirationInDays: 90  # 90-day retention as per requirements
          - Id: TransitionAuditLogs
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 60
                StorageClass: GLACIER
      NotificationConfiguration:
        CloudWatchConfigurations:
          - Event: s3:ObjectCreated:*
            CloudWatchConfiguration:
              LogGroupName: !Ref AuditTrailLogGroup
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: AuditTrail

  # CloudTrail Bucket Policy
  AuditTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsProduction
    Properties:
      Bucket: !Ref AuditTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !Sub "${AuditTrailBucket}"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/home-inventory-audit-trail-${Environment}"
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${AuditTrailBucket}/cloudtrail-logs/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                AWS:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/home-inventory-audit-trail-${Environment}"

  # CloudWatch Log Group for CloudTrail (Production only)
  AuditTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsProduction
    Properties:
      LogGroupName: !Sub /aws/cloudtrail/home-inventory-${Environment}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: AuditTrail

  # IAM Role for CloudTrail to write to CloudWatch Logs
  CloudTrailLogsRole:
    Type: AWS::IAM::Role
    Condition: IsProduction
    Properties:
      RoleName: !Sub home-inventory-cloudtrail-logs-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !Sub "${AuditTrailLogGroup}:*"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: AuditTrail

  # CloudWatch Alarms for Audit Trail Monitoring
  AuditTrailErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub home-inventory-audit-trail-errors-${Environment}
      AlarmDescription: CloudTrail logging errors detected
      MetricName: ErrorCount
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: AlertType
          Value: AuditCompliance

  # Compliance Monitoring Alarms
  UnauthorizedAPICallsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub home-inventory-unauthorized-api-calls-${Environment}
      AlarmDescription: Unauthorized API calls detected in CloudTrail
      MetricName: UnauthorizedAPICalls
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: AlertType
          Value: ComplianceViolation

  # Root Account Usage Alarm
  RootAccountUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub home-inventory-root-account-usage-${Environment}
      AlarmDescription: Root account usage detected
      MetricName: RootAccountUsage
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: AlertType
          Value: ComplianceViolation

  # SNS Topic for Security Alerts (separate from general alerts)
  SecurityAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub home-inventory-security-alerts-${Environment}
      DisplayName: !Sub Home Inventory Security Alerts - ${Environment}
      KmsMasterKeyId: !If [IsProduction, alias/aws/sns, !Ref AWS::NoValue]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: SecurityMonitoring

  # Security Alert Email Subscription
  SecurityAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      TopicArn: !Ref SecurityAlertTopic
      Endpoint: !Ref SecurityNotificationEmail

  # SNS Topic for Budget Notifications
  BudgetAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub home-inventory-budget-alerts-${Environment}
      DisplayName: !Sub Home Inventory Budget Alerts - ${Environment}
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: CostManagement

  # Cost Budget with Environment-Specific Limits
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub home-inventory-budget-${Environment}
        BudgetLimit:
          Amount: !If [IsProduction, 30, 20]  # $30 prod, $20 dev
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostFilters:
          TagKey:
            - Environment
          TagValue:
            - !Ref Environment
      NotificationsWithSubscribers:
        # 50% threshold alert
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic
        # 80% threshold alert
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic
        # 100% threshold alert
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic

  # Log Groups for Lambda Functions
  ContainerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ContainerFunction}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment

  PackingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PackingFunction}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment

  QRCodeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${QRCodeFunction}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment

  ProjectFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectFunction}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment

  ReportsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ReportsFunction}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment

  AnalyticsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalyticsFunction}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId

  BucketName:
    Description: S3 Bucket Name for Photos
    Value: !Ref PhotoBucket
    Export:
      Name: !Sub ${AWS::StackName}-BucketName

  QRReportBucketName:
    Description: S3 Bucket Name for QR Codes and Reports
    Value: !Ref QRCodeReportBucket
    Export:
      Name: !Sub ${AWS::StackName}-QRReportBucketName

  AlertTopicArn:
    Description: SNS Topic ARN for Alerts
    Value: !Ref AlertTopic
    Export:
      Name: !Sub ${AWS::StackName}-AlertTopicArn

  BudgetAlertTopicArn:
    Description: SNS Topic ARN for Budget Alerts
    Value: !Ref BudgetAlertTopic
    Export:
      Name: !Sub ${AWS::StackName}-BudgetAlertTopicArn

  DashboardUrl:
    Description: CloudWatch Dashboard URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${MonitoringDashboard}
    Export:
      Name: !Sub ${AWS::StackName}-DashboardUrl

  SecurityAlertTopicArn:
    Description: SNS Topic ARN for Security Alerts
    Value: !Ref SecurityAlertTopic
    Export:
      Name: !Sub ${AWS::StackName}-SecurityAlertTopicArn

  WAFWebACLArn:
    Condition: IsProduction
    Description: WAF Web ACL ARN
    Value: !GetAtt WebACL.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WAFWebACLArn

  WebsiteBucket:
    Description: S3 Bucket Name for Frontend Website
    Value: !Ref WebsiteBucket
    Export:
      Name: !Sub ${AWS::StackName}-WebsiteBucket

  TableName:
    Description: DynamoDB Table Name
    Value: !Ref InventoryTable
    Export:
      Name: !Sub ${AWS::StackName}-TableName

  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
    Export:
      Name: !Sub ${AWS::StackName}-Region

