AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Home Inventory Management System - Serverless Infrastructure

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref InventoryTable
        BUCKET_NAME: !Ref PhotoBucket
        QR_REPORT_BUCKET_NAME: !Ref QRCodeReportBucket
        USER_POOL_ID: !Ref UserPool
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
        AUDIT_LOG_HMAC_SECRET: !Sub 'default-secret-change-in-production-${Environment}'
        ALLOWED_ORIGINS: 'https://d24t9lc3ds7gry.cloudfront.net,http://localhost:5173,http://localhost:3000'
        NODE_ENV: !Ref Environment

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name
  
  OpenAIAPIKey:
    Type: String
    Default: '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'
    Description: OpenAI API Key for AI analysis features
    NoEcho: true
  
Resources:

  # Secrets Manager Secret for Audit Log HMAC
  AuditLogHMACSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub home-inv-audit-secret-${Environment}
      Description: HMAC secret for audit log integrity protection
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: hmac_secret
        PasswordLength: 64
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # S3 Bucket for Frontend Website Hosting
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub home-inv-frontend-${AWS::AccountId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub home-inv-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub home-inv-client-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  # DynamoDB Table - Single Table Design
  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub home-inv-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: locationId
          AttributeType: S
        - AttributeName: containerId
          AttributeType: S
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: qrCode
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ContainerLocationIndex
          KeySchema:
            - AttributeName: locationId
              KeyType: HASH
            - AttributeName: containerId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ProjectContainerIndex
          KeySchema:
            - AttributeName: projectId
              KeyType: HASH
            - AttributeName: containerId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: QRCodeIndex
          KeySchema:
            - AttributeName: qrCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: HomeInventorySystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # S3 Bucket for Photos
  PhotoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub home-inv-photos-${AWS::AccountId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - 'https://d24t9lc3ds7gry.cloudfront.net'
              - 'http://localhost:3000'
              - 'http://localhost:5173'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
            AllowedHeaders:
              - '*'
            MaxAge: 3000
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # S3 Bucket for QR Codes and Reports
  QRCodeReportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub home-inv-qr-reports-${AWS::AccountId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldQRCodes
            Status: Enabled
            ExpirationInDays: 365
          - Id: DeleteOldReports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - 'https://d24t9lc3ds7gry.cloudfront.net'
              - 'http://localhost:3000'
              - 'http://localhost:5173'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - 'Content-Length'
              - 'Content-Type'
              - 'ETag'
            MaxAge: 3000
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # API Gateway HTTP API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          
          - 'https://d24t9lc3ds7gry.cloudfront.net'  # Current CloudFront URL
          - 'http://localhost:5173'
          - 'http://localhost:3000'  # Support both Vite and Create React App dev servers
        AllowHeaders:
          - 'Content-Type'
          - 'Authorization'
          - 'X-Amz-Date'
          - 'X-Api-Key'
          - 'X-Amz-Security-Token'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600
        AllowCredentials: true
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              Audience:
                - !Ref UserPoolClient
              Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}

  # Lambda Functions will be added in subsequent tasks
  # Placeholder for Things Lambda
  ThingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/things.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
        - Version: '2012-10-17'
