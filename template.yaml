              Resource: !Ref AuditLogHMACSecret
      Events:
        GetNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notifications
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        MarkAsRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notifications/{id}/read
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        CreateNotification:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notifications
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Collaboration Lambda
  CollaborationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/collaboration.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref AuditLogHMACSecret
      Events:
        GetActivityFeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /collaboration/activity
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        CreateActivity:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /collaboration/activity
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Data Migration Lambda
  DataMigrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/dataMigration.handler
      Timeout: 300  # 5 minutes for migration operations
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref AuditLogHMACSecret
      Events:
        MigrateInventoryData:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /migration/inventory-to-containers
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        ValidateData:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /migration/validate
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Data Synchronization Lambda
  DataSynchronizationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/dataSynchronization.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref AuditLogHMACSecret
      Events:
        SyncInventoryData:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /sync/inventory
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        CheckConsistency:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /sync/check-consistency
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Audit Logs Lambda
  AuditLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/auditLogs.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InventoryTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref AuditLogHMACSecret
      Events:
        GetAuditLogs:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /audit-logs
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        GetContainerAuditLogs:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /audit-logs/container/{containerId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Performance Metrics Lambda
  PerformanceMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/performanceMetrics.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricStatistics
                - cloudwatch:ListMetrics
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
                - logs:GetLogEvents
              Resource: '*'
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref AuditLogHMACSecret
      Events:
        GetPerformanceMetrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /performance/metrics
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Storage Alerts Lambda
  StorageAlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/storageAlerts.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref AuditLogHMACSecret
      Events:
        CheckStorageAlerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /storage-alerts/check
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        CreateStorageAlert:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /storage-alerts/create
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        ListStorageAlerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /storage-alerts
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        MarkAlertAsRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /storage-alerts/{id}/read
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        ResolveAlert:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /storage-alerts/{id}/resolve
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  # CloudWatch Resources for Monitoring and Alerting

  # SNS Topic for Alerts
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub home-inventory-alerts-${Environment}
      DisplayName: Home Inventory System Alerts
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Enhanced CloudWatch Dashboard for Production Monitoring
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub home-inventory-${Environment}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${ContainerFunction}" ],
                  [ ".", ".", ".", "${PackingFunction}" ],
                  [ ".", ".", ".", "${QRCodeFunction}" ],
                  [ ".", ".", ".", "${ProjectFunction}" ],
                  [ ".", ".", ".", "${UserManagementFunction}" ],
                  [ ".", ".", ".", "${InventoryFunction}" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Function Duration",
                "period": 300,
                "yAxis": {
                  "left": {
                    "min": 0,
                    "max": 30000
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${ContainerFunction}" ],
                  [ ".", ".", ".", "${PackingFunction}" ],
                  [ ".", ".", ".", "${QRCodeFunction}" ],
                  [ ".", ".", ".", "${ProjectFunction}" ],
                  [ ".", ".", ".", "${UserManagementFunction}" ],
                  [ ".", ".", ".", "${InventoryFunction}" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Function Errors",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${InventoryTable}" ],
                  [ ".", "ConsumedWriteCapacityUnits", ".", "." ],
                  [ ".", "ThrottledRequests", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "DynamoDB Capacity Usage & Throttling",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiName", "${HttpApi}" ],
                  [ ".", "4XXError", ".", "." ],
                  [ ".", "5XXError", ".", "." ],
                  [ ".", "Latency", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "API Gateway Requests, Errors & Latency",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${ContainerFunction}" ],
                  [ ".", ".", ".", "${PackingFunction}" ],
                  [ ".", ".", ".", "${QRCodeFunction}" ],
                  [ ".", ".", ".", "${ProjectFunction}" ],
                  [ ".", ".", ".", "${UserManagementFunction}" ],
                  [ ".", ".", ".", "${InventoryFunction}" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Invocations (Free Tier: 1M/month)",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/S3", "BucketSizeBytes", "BucketName", "${PhotoBucket}", "StorageType", "StandardStorage" ],
                  [ ".", ".", ".", "${QRCodeReportBucket}", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "S3 Storage Usage (Free Tier: 5GB)",
                "period": 86400
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/S3", "NumberOfObjects", "BucketName", "${PhotoBucket}", "StorageType", "AllStorageTypes" ],
                  [ ".", ".", ".", "${QRCodeReportBucket}", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "S3 Object Count",
                "period": 86400
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Logs", "IncomingBytes", "LogGroupName", "/aws/lambda/${ContainerFunction}" ],
                  [ ".", ".", ".", "/aws/lambda/${PackingFunction}" ],
                  [ ".", ".", ".", "/aws/lambda/${QRCodeFunction}" ],
                  [ ".", ".", ".", "/aws/lambda/${ProjectFunction}" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "CloudWatch Logs Ingestion (Free Tier: 5GB/month)",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Billing", "EstimatedCharges", "Currency", "USD", "ServiceName", "AmazonDynamoDB" ],
                  [ ".", ".", ".", ".", ".", "AWSLambda" ],
                  [ ".", ".", ".", ".", ".", "AmazonS3" ],
                  [ ".", ".", ".", ".", ".", "AmazonApiGateway" ],
                  [ ".", ".", ".", ".", ".", "AmazonCloudWatch" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Estimated Charges by Service",
                "period": 86400
              }
            }
          ]
        }

  # CloudWatch Alarms - TEMPORARILY REMOVED
  # These alarms will be added back after Lambda functions are deployed
  # and metrics are available. Alarms require existing metrics to validate.
  # Removed resources: HighDurationAlarm, DynamoDBThrottlingAlarm, APIGateway5XXAlarm,
  # LambdaFreeTierAlarm, APIGatewayFreeTierAlarm, CloudWatchLogsFreeTierAlarm,
  # DailyCostAlarm, DynamoDBCostAlarm, S3CostAlarm, WebACL, WebACLAssociation,
  # WAFLogGroup, WAFLoggingConfiguration, WAFBlockedRequestsAlarm,
  # AuthenticationFailureAlarm, UnusualErrorPatternAlarm, DynamoDBSecurityAlarm,
  # SuspiciousLoginAlarm, DataExfiltrationAlarm, PrivilegeEscalationAlarm,
  # DatabaseInjectionAlarm, UnusualAPIUsageAlarm, AuditTrail, AuditTrailBucket,
  # AuditTrailBucketPolicy, AuditTrailLogGroup, CloudTrailLogsRole,
  # AuditTrailErrorAlarm, UnauthorizedAPICallsAlarm, RootAccountUsageAlarm,
  # SecurityAlertTopic, SecurityAlertEmailSubscription, BudgetAlertTopic, CostBudget,
  # ContainerFunctionLogGroup, PackingFunctionLogGroup, QRCodeFunctionLogGroup,
  # ProjectFunctionLogGroup, ReportsFunctionLogGroup, AnalyticsFunctionLogGroup

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId

  BucketName:
    Description: S3 Bucket Name for Photos
    Value: !Ref PhotoBucket
    Export:
      Name: !Sub ${AWS::StackName}-BucketName

  QRReportBucketName:
    Description: S3 Bucket Name for QR Codes and Reports
    Value: !Ref QRCodeReportBucket
    Export:
      Name: !Sub ${AWS::StackName}-QRReportBucketName

  AlertTopicArn:
    Description: SNS Topic ARN for Alerts
    Value: !Ref AlertTopic
    Export:
      Name: !Sub ${AWS::StackName}-AlertTopicArn

  TableName:
    Description: DynamoDB Table Name
    Value: !Ref InventoryTable
    Export:
      Name: !Sub ${AWS::StackName}-TableName

  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
    Export:
      Name: !Sub ${AWS::StackName}-Region

  WebsiteBucket:
    Description: S3 Bucket Name for Frontend Website
    Value: !Ref WebsiteBucketResource
    Export:
      Name: !Sub ${AWS::StackName}-WebsiteBucket

