AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WheresMyStuff Remote MCP Server - Serverless

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs22.x
    MemorySize: 256
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - '*'
      AllowMethods:
        - GET
        - POST
        - DELETE
      AllowHeaders:
        - Authorization
        - Content-Type
        - Mcp-Session-Id
        - Accept

Parameters:
  ApiUrl:
    Type: String
    Description: Backend API URL
  UserPoolId:
    Type: String
    Description: Cognito User Pool ID
  ClientId:
    Type: String
    Description: Cognito App Client ID
  CognitoDomain:
    Type: String
    Description: Cognito domain for Hosted UI
  TokenSigningSecret:
    Type: String
    NoEcho: true
    Description: Secret for signing JWT access tokens

Resources:
  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/remote/lambda-handler.handler
      CodeUri: .
      Environment:
        Variables:
          SESSIONS_TABLE_NAME: !Ref SessionsTable
          WHERESMYSTUFF_API_URL: !Ref ApiUrl
          WHERESMYSTUFF_USER_POOL_ID: !Ref UserPoolId
          WHERESMYSTUFF_CLIENT_ID: !Ref ClientId
          WHERESMYSTUFF_REGION: !Ref AWS::Region
          WHERESMYSTUFF_COGNITO_DOMAIN: !Ref CognitoDomain
          TOKEN_SIGNING_SECRET: !Ref TokenSigningSecret
      Events:
        McpPost:
          Type: HttpApi
          Properties:
            Path: /mcp
            Method: POST
        McpDelete:
          Type: HttpApi
          Properties:
            Path: /mcp
            Method: DELETE
        Health:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
        OAuthMetadata:
          Type: HttpApi
          Properties:
            Path: /.well-known/oauth-authorization-server
            Method: GET
        Authorize:
          Type: HttpApi
          Properties:
            Path: /authorize
            Method: GET
        Callback:
          Type: HttpApi
          Properties:
            Path: /callback
            Method: GET
        Token:
          Type: HttpApi
          Properties:
            Path: /token
            Method: POST
        Register:
          Type: HttpApi
          Properties:
            Path: /register
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mcp-sessions-${AWS::StackName}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

Outputs:
  McpEndpoint:
    Description: MCP Server URL for client configuration
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/mcp'
