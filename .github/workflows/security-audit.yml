name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security audit daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        directory: [backend, frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      working-directory: ${{ matrix.directory }}
      run: npm install
    
    - name: Run security audit
      working-directory: ${{ matrix.directory }}
      run: |
        echo "Running npm audit for ${{ matrix.directory }}"
        npm run security:check || true
    
    - name: Check for high/critical vulnerabilities
      working-directory: ${{ matrix.directory }}
      run: |
        # Check for high or critical vulnerabilities, excluding known non-applicable advisories.
        # GHSA-qwww-vcr4-c8h2: React Router RSC Mode CSRF - only affects React Server Components mode,
        # not client-side SPAs using Vite. No fix available in v7.x (requires 8.3.0+).
        AUDIT_OUTPUT=$(npm audit --json --omit=dev 2>/dev/null) || true
        
        if [ -z "$AUDIT_OUTPUT" ]; then
          AUDIT_OUTPUT='{"vulnerabilities":{}}'
        fi
        
        echo "$AUDIT_OUTPUT" | node -e "
          const stdin = require('fs').readFileSync(0, 'utf8');
          const data = JSON.parse(stdin);
          const excluded = process.env.EXCLUDED_ADVISORIES.split(',').map(s => s.trim());
          const vulns = data.vulnerabilities || {};
          let hasHigh = false;
          for (const [name, vuln] of Object.entries(vulns)) {
            const dominated = (vuln.via || []).every(v => {
              if (typeof v === 'string') return true;
              return excluded.some(e => (v.url || '').includes(e));
            });
            if (!dominated && (vuln.severity === 'high' || vuln.severity === 'critical')) {
              console.error('❌ ' + name + ': ' + vuln.severity + ' - ' + JSON.stringify(vuln.via));
              hasHigh = true;
            }
          }
          if (hasHigh) {
            console.error('High or critical vulnerabilities found in production dependencies!');
            console.error('Run npm audit for details and npm audit fix to attempt fixes.');
            process.exit(1);
          } else {
            console.log('✅ No actionable high/critical vulnerabilities in production dependencies');
            if (excluded.length > 0) {
              console.log('ℹ️  Excluded advisories (not applicable): ' + excluded.join(', '));
            }
          }
        "
      env:
        EXCLUDED_ADVISORIES: "GHSA-qwww-vcr4-c8h2"
    
    - name: Generate audit report
      if: always()
      working-directory: ${{ matrix.directory }}
      run: |
        npm audit --json > audit-report-${{ matrix.directory }}.json || true
        npm audit > audit-report-${{ matrix.directory }}.txt || true
    
    - name: Upload audit reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audit-reports-${{ matrix.directory }}
        path: |
          ${{ matrix.directory }}/audit-report-${{ matrix.directory }}.json
          ${{ matrix.directory }}/audit-report-${{ matrix.directory }}.txt
        retention-days: 30

  notify-security-issues:
    needs: security-audit
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
    - name: Notify on security issues
      run: |
        echo "Security vulnerabilities detected! Check the audit reports for details."
        echo "This job failed because high or critical vulnerabilities were found."