name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        directory: [backend, frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ${{ matrix.directory }}/package-lock.json
    
    - name: Install dependencies
      working-directory: ${{ matrix.directory }}
      run: npm ci
    
    - name: Run security audit
      working-directory: ${{ matrix.directory }}
      run: npm run security:check
    
    - name: Fail on high/critical vulnerabilities
      working-directory: ${{ matrix.directory }}
      run: |
        # Check for high or critical vulnerabilities and fail if found
        if ! npm audit --audit-level=high --omit=dev; then
          echo "❌ High or critical vulnerabilities found in production dependencies!"
          echo "Please run 'npm audit fix' or update vulnerable packages."
          exit 1
        fi

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: security-audit
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install backend dependencies
      working-directory: backend
      run: npm ci
    
    - name: Run backend tests
      working-directory: backend
      run: npm test
    
    - name: Upload backend test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: backend/coverage/
        retention-days: 30

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: security-audit
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    
    - name: Run frontend linting
      working-directory: frontend
      run: npm run lint
    
    - name: Build frontend
      working-directory: frontend
      run: npm run build

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [security-audit, test-backend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install backend dependencies
      working-directory: backend
      run: npm ci --production
    
    - name: Final security check on production dependencies
      working-directory: backend
      run: npm audit --audit-level=high --omit=dev
    
    - name: Package backend for deployment
      run: |
        mkdir -p dist/backend
        cp -r backend/* dist/backend/
        # Remove dev dependencies and test files
        rm -rf dist/backend/node_modules
        rm -rf dist/backend/tests
        cd dist/backend && npm ci --production
    
    - name: Upload backend build artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-build
        path: dist/backend/
        retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [security-audit, test-backend, test-frontend, build-backend]
    if: always()
    
    steps:
    - name: Security Check Summary
      run: |
        echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Dependency vulnerability scanning completed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ No high or critical vulnerabilities in production dependencies" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ All tests passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- Monitor Dependabot PRs for security updates" >> $GITHUB_STEP_SUMMARY
        echo "- Review audit reports in artifacts if any issues were found" >> $GITHUB_STEP_SUMMARY