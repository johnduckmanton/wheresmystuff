name: Deploy Moving & Storage System

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'template.yaml'
      - 'samconfig.toml'
      - '.github/workflows/deploy-moving-storage.yml'
  
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'template.yaml'
      - 'samconfig.toml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required to checkout code
  security-events: write  # Required for security scanning

env:
  AWS_REGION: eu-west-1
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Test and validate code
  test:
    name: Test and Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      
      - name: Run backend tests
        working-directory: backend
        run: npm test
      
      - name: Run backend linting
        working-directory: backend
        run: npm run lint || true  # Don't fail on linting errors for now
      
      - name: Run frontend linting
        working-directory: frontend
        run: npm run lint || true  # Don't fail on linting errors for now
      
      - name: Validate CloudFormation template exists
        run: |
          if [ -f template.yaml ]; then
            echo "✅ CloudFormation template found"
            # Basic check that it's not empty and contains Resources
            if grep -q "Resources:" template.yaml; then
              echo "✅ Template contains Resources section"
            else
              echo "⚠️  Warning: Template may not have Resources section"
            fi
          else
            echo "❌ CloudFormation template not found"
            exit 1
          fi

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js for security audit
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run npm audit (backend)
        run: |
          cd backend
          npm audit --audit-level=high || true
      
      - name: Run npm audit (frontend)
        run: |
          cd frontend
          npm audit --audit-level=high || true
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'

  # Deploy to development environment
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check AWS credentials configuration
        run: |
          if [ -z "${{ vars.DEV_ROLE_ARN }}" ]; then
            echo "⚠️  DEV_ROLE_ARN not configured in repository variables"
            echo "Please configure GitHub OIDC and set DEV_ROLE_ARN in repository variables"
            echo "See GITHUB_OIDC_SETUP.md for instructions"
            exit 1
          fi
          echo "✅ DEV_ROLE_ARN is configured"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_ROLE_ARN }}
          role-session-name: GitHubActions-MovingStorage-Dev-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      
      - name: Build SAM application
        run: sam build --template template.yaml
      
      - name: Deploy infrastructure
        run: |
          sam deploy \
            --stack-name home-inventory-dev \
            --parameter-overrides \
              Environment=dev \
              EnableWAF=true \
              EnableAdvancedMonitoring=false \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-confirm-changeset \
            --resolve-s3
      
      - name: Run database migrations
        working-directory: backend
        run: |
          node scripts/add-moving-storage-indexes.js --environment=dev || true
          node scripts/migrate-moving-storage-schema.js --environment=dev || true
      
      - name: Build and deploy frontend
        run: |
          # Get stack outputs
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name home-inventory-dev \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name home-inventory-dev \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)
          
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name home-inventory-dev \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)
          
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name home-inventory-dev \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucket'].OutputValue" \
            --output text)
          
          CLOUDFRONT_ID=$(aws cloudformation describe-stacks \
            --stack-name home-inventory-dev \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          
          # Build frontend
          cd frontend
          cat > .env.production << EOF
          VITE_API_URL=${API_URL}
          VITE_USER_POOL_ID=${USER_POOL_ID}
          VITE_USER_POOL_CLIENT_ID=${USER_POOL_CLIENT_ID}
          VITE_REGION=${{ env.AWS_REGION }}
          VITE_ENVIRONMENT=dev
          EOF
          
          npm run build
          
          # Deploy to S3
          aws s3 sync dist/ s3://${BUCKET_NAME}/ --delete
          
          # Invalidate CloudFront
          aws cloudfront create-invalidation \
            --distribution-id ${CLOUDFRONT_ID} \
            --paths "/*"

  # Deploy to production (manual approval required)
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check AWS credentials configuration
        run: |
          if [ -z "${{ vars.PROD_ROLE_ARN }}" ]; then
            echo "⚠️  PROD_ROLE_ARN not configured in repository variables"
            echo "Please configure GitHub OIDC and set PROD_ROLE_ARN in repository variables"
            echo "See GITHUB_OIDC_SETUP.md for instructions"
            exit 1
          fi
          echo "✅ PROD_ROLE_ARN is configured"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PROD_ROLE_ARN }}
          role-session-name: GitHubActions-MovingStorage-Prod-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      
      - name: Build SAM application
        run: sam build --template template.yaml
      
      - name: Deploy infrastructure
        run: |
          sam deploy \
            --stack-name home-inventory-prod \
            --parameter-overrides \
              Environment=prod \
              EnableWAF=true \
              EnableAdvancedMonitoring=true \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-confirm-changeset \
            --resolve-s3
      
      - name: Run database migrations
        working-directory: backend
        run: |
          node scripts/add-moving-storage-indexes.js --environment=prod || true
          node scripts/migrate-moving-storage-schema.js --environment=prod || true
      
      - name: Build and deploy frontend
        run: |
          # Production deployment with custom domain support
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name home-inventory-prod \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name home-inventory-prod \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)
          
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name home-inventory-prod \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)
          
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name home-inventory-prod \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucket'].OutputValue" \
            --output text)
          
          CLOUDFRONT_ID=$(aws cloudformation describe-stacks \
            --stack-name home-inventory-prod \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          
          # Build frontend
          cd frontend
          cat > .env.production << EOF
          VITE_API_URL=${API_URL}
          VITE_USER_POOL_ID=${USER_POOL_ID}
          VITE_USER_POOL_CLIENT_ID=${USER_POOL_CLIENT_ID}
          VITE_REGION=${{ env.AWS_REGION }}
          VITE_ENVIRONMENT=prod
          EOF
          
          npm run build
          
          # Deploy to S3
          aws s3 sync dist/ s3://${BUCKET_NAME}/ --delete
          
          # Invalidate CloudFront
          aws cloudfront create-invalidation \
            --distribution-id ${CLOUDFRONT_ID} \
            --paths "/*"
      
      - name: Run smoke tests
        run: |
          # Add smoke tests for production
          echo "Production smoke tests would run here"
      
      - name: Notify deployment success
        run: |
          echo "🎉 Production deployment completed successfully!"